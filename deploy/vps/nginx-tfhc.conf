# Include inside the existing HTTPS server block, after validation with nginx -t.
# The existing UtilityHub routes are retained. No production activation implied.
location = /tfhc {
    return 308 /tfhc/;
}
location ^~ /tfhc/ {
    proxy_pass http://127.0.0.1:14001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 20m;
    proxy_buffering off;
    # Never replay a mutation automatically to another upstream.
    proxy_next_upstream off;
}
