name: tfhc-production
services:
  api:
    image: ${TFHC_IMAGE:?Set a verified immutable image digest or image ID}
    container_name: tfhc-production-api
    restart: unless-stopped
    env_file:
      - ./production.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      OPERATIONAL_DATABASE: postgresql
      CHAT_SHARED_DB_PATH: /var/data/chat-cache.db
      DISABLE_SCHEDULED_JOBS: "false"
      DISABLE_RATE_LIMIT: "false"
      TFHC_TIMEZONE: Africa/Lagos
      NODE_OPTIONS: --max-old-space-size=384
      REDIS_URL: redis://:3gMp4cTUE1s2s8JPsCx84cJjw-ooRNSb@rediscache:6379
    ports:
      - "127.0.0.1:14001:4000"
    networks:
      - default
      - utilityhub_net
    volumes:
      - type: bind
        source: ./data
        target: /var/data
        bind:
          create_host_path: false
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  default:
  utilityhub_net:
    external: true
    name: utilityhub_default

