<style>
        .scanner-frame {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
        }
        .corner {
            width: 40px;
            height: 40px;
            position: absolute;
            border-color: #fe932c; /* secondary-container */
            border-width: 4px;
        }
        .corner-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
        .corner-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 12px; }
        .corner-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 12px; }
        .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 12px; }
        
        .scan-line {
            width: 100%;
            height: 2px;
            background: #fe932c;
            position: absolute;
            top: 0;
            box-shadow: 0 0 10px 2px rgba(254, 147, 44, 0.5);
            animation: scan 2s infinite linear;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

<script>
        // Simple real-time clock for the timestamp counter
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            const strTime = hours + ':' + minutes + ':' + seconds + ' ' + ampm;
            document.getElementById('realtime-clock').textContent = strTime;
        }
        
        setInterval(updateTime, 1000);
        updateTime();
    </script>
