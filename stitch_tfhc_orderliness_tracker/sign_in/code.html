<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>TFHC Orderliness - Sign In</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#6e3900",
                        "secondary-container": "#fe932c",
                        "surface": "#f8f9ff",
                        "on-primary-fixed": "#131b2e",
                        "secondary-fixed-dim": "#ffb77d",
                        "primary-fixed-dim": "#bec6e0",
                        "on-primary-fixed-variant": "#3f465c",
                        "outline": "#76777d",
                        "inverse-on-surface": "#eaf1ff",
                        "primary": "#000000",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "tertiary": "#000000",
                        "tertiary-container": "#002113",
                        "secondary-fixed": "#ffdcc3",
                        "on-background": "#0b1c30",
                        "on-tertiary-fixed-variant": "#005236",
                        "outline-variant": "#c6c6cd",
                        "surface-container-low": "#eff4ff",
                        "on-secondary-container": "#663500",
                        "on-tertiary-fixed": "#002113",
                        "on-surface": "#0b1c30",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed": "#dae2fd",
                        "surface-tint": "#565e74",
                        "on-tertiary-container": "#009668",
                        "surface-bright": "#f8f9ff",
                        "surface-dim": "#cbdbf5",
                        "error": "#ba1a1a",
                        "primary-container": "#131b2e",
                        "surface-container-highest": "#d3e4fe",
                        "secondary": "#904d00",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-secondary-fixed": "#2f1500",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#45464d",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#213145",
                        "background": "#f8f9ff",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-container": "#e5eeff",
                        "on-primary-container": "#7c839b",
                        "surface-variant": "#d3e4fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "gutter": "12px",
                        "section-gap": "32px",
                        "edge-margin": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-edge-margin font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Main Authentication Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0px_2px_8px_rgba(0,0,0,0.05)] p-stack-lg border border-outline-variant/30 flex flex-col gap-stack-lg relative overflow-hidden">
<!-- Subtle decorative top accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary"></div>
<!-- Header / Brand Section -->
<header class="flex flex-col items-center text-center gap-stack-sm pt-stack-sm">
<!-- Brand Logo (Navy & Gold representation via text/icon since no image asset provided) -->
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-2 shadow-sm border border-outline-variant/20 text-primary relative">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">account_balance</span>
<!-- Subtle gold accent -->
<div class="absolute bottom-0 right-0 w-4 h-4 bg-secondary rounded-full border-2 border-surface-container-lowest"></div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">TFHC Orderliness</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Attendance &amp; Participation Tracker</p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md mt-4" onsubmit="event.preventDefault(); alert('Sign In Attempted');">
<!-- Member ID / Email Input -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="memberId">Member ID / Email</label>
<div class="relative flex items-center">
<div class="absolute left-3 text-outline flex items-center pointer-events-none">
<span class="material-symbols-outlined text-xl">badge</span>
</div>
<input class="w-full bg-surface h-12 pl-10 pr-4 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface font-body-md placeholder-outline-variant" id="memberId" placeholder="e.g. TFHC-1042" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative flex items-center">
<div class="absolute left-3 text-outline flex items-center pointer-events-none">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
<input class="w-full bg-surface h-12 pl-10 pr-12 rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-on-surface font-body-md placeholder-outline-variant" id="password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1 rounded-full focus:outline-none focus:ring-2 focus:ring-primary/50" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-xl" id="eyeIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-4 h-4 border border-outline-variant rounded bg-surface checked:bg-primary checked:border-primary transition-colors cursor-pointer focus:ring-2 focus:ring-primary/30 focus:ring-offset-1 focus:ring-offset-surface-container-lowest" type="checkbox"/>
<span class="material-symbols-outlined text-[12px] text-on-primary absolute opacity-0 peer-checked:opacity-100 pointer-events-none" style="font-variation-settings: 'wght' 700;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors font-medium" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg mt-stack-sm hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</main>
<!-- Footer Links -->
<footer class="mt-stack-lg text-center">
<a class="font-body-md text-body-md text-outline hover:text-on-surface transition-colors flex items-center justify-center gap-2" href="#">
<span class="material-symbols-outlined text-[18px]">help</span>
            Need help? Contact Unit Administrator
        </a>
</footer>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.textContent = 'visibility';
            } else {
                pwdInput.type = 'password';
                eyeIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
