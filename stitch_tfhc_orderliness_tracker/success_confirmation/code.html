<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Check-In Success Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#6e3900",
                        "secondary-container": "#fe932c",
                        "surface": "#f8f9ff",
                        "on-primary-fixed": "#131b2e",
                        "secondary-fixed-dim": "#ffb77d",
                        "primary-fixed-dim": "#bec6e0",
                        "on-primary-fixed-variant": "#3f465c",
                        "outline": "#76777d",
                        "inverse-on-surface": "#eaf1ff",
                        "primary": "#000000",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "tertiary": "#000000",
                        "tertiary-container": "#002113",
                        "secondary-fixed": "#ffdcc3",
                        "on-background": "#0b1c30",
                        "on-tertiary-fixed-variant": "#005236",
                        "outline-variant": "#c6c6cd",
                        "surface-container-low": "#eff4ff",
                        "on-secondary-container": "#663500",
                        "on-tertiary-fixed": "#002113",
                        "on-surface": "#0b1c30",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed": "#dae2fd",
                        "surface-tint": "#565e74",
                        "on-tertiary-container": "#009668",
                        "surface-bright": "#f8f9ff",
                        "surface-dim": "#cbdbf5",
                        "error": "#ba1a1a",
                        "primary-container": "#131b2e",
                        "surface-container-highest": "#d3e4fe",
                        "secondary": "#904d00",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-secondary-fixed": "#2f1500",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#45464d",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#213145",
                        "background": "#f8f9ff",
                        "tertiary-fixed": "#6ffbbe",
                        "surface-container": "#e5eeff",
                        "on-primary-container": "#7c839b",
                        "surface-variant": "#d3e4fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "stack-md": "16px",
                        "gutter": "12px",
                        "section-gap": "32px",
                        "edge-margin": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 16px;
            background-color: #ffdcc3; /* secondary-fixed */
            opacity: 0;
            animation: confetti-fall 2s ease-in-out infinite;
        }
        @keyframes confetti-fall {
            0% { opacity: 1; transform: translateY(-100%) rotate(0deg); }
            100% { opacity: 0; transform: translateY(200px) rotate(360deg); }
        }
        /* Generate some random positions and colors for confetti */
        .confetti-piece:nth-child(1) { left: 10%; animation-delay: 0s; background-color: #dae2fd; } /* primary-fixed */
        .confetti-piece:nth-child(2) { left: 30%; animation-delay: 0.5s; background-color: #6ffbbe; } /* tertiary-fixed */
        .confetti-piece:nth-child(3) { left: 50%; animation-delay: 0.2s; background-color: #ffdcc3; }
        .confetti-piece:nth-child(4) { left: 70%; animation-delay: 0.7s; background-color: #dae2fd; }
        .confetti-piece:nth-child(5) { left: 90%; animation-delay: 0.4s; background-color: #6ffbbe; }
        .confetti-piece:nth-child(6) { left: 20%; animation-delay: 0.8s; background-color: #ffdcc3; }
        .confetti-piece:nth-child(7) { left: 40%; animation-delay: 0.1s; background-color: #dae2fd; }
        .confetti-piece:nth-child(8) { left: 60%; animation-delay: 0.9s; background-color: #6ffbbe; }
        .confetti-piece:nth-child(9) { left: 80%; animation-delay: 0.3s; background-color: #ffdcc3; }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col font-sans antialiased overflow-hidden relative">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-primary/80 z-40 flex items-center justify-center p-edge-margin backdrop-blur-sm">
<!-- Modal Content Canvas -->
<main class="w-full max-w-sm bg-surface-container-lowest rounded-xl shadow-[0px_2px_8px_rgba(0,0,0,0.05)] relative overflow-hidden z-50 flex flex-col items-center justify-center p-stack-lg animate-[fade-in_0.3s_ease-out]">
<!-- Confetti Effect Container -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
<div class="confetti-piece"></div>
</div>
<!-- Success Icon -->
<div class="z-10 bg-tertiary-container/10 rounded-full p-4 mb-stack-md flex items-center justify-center shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<span class="material-symbols-outlined text-[64px] text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Headline -->
<h1 class="font-headline-lg text-headline-lg text-primary text-center mb-stack-sm z-10 w-full tracking-tight">
                Check-In Confirmed!
            </h1>
<!-- Badge -->
<div class="z-10 bg-tertiary-container/10 text-on-tertiary-container px-3 py-1 rounded-full mb-stack-lg inline-flex items-center gap-1 shadow-[0px_2px_8px_rgba(0,0,0,0.05)]">
<span class="material-symbols-outlined text-[14px]">stars</span>
<span class="font-label-md text-label-md uppercase tracking-wider">ON TIME (+10 Points)</span>
</div>
<!-- Data Summary Glass Card -->
<div class="z-10 w-full bg-surface-container/50 border border-outline-variant/30 rounded-lg p-stack-md mb-stack-lg flex flex-col gap-gutter backdrop-blur-md">
<div class="flex justify-between items-center w-full">
<span class="font-body-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                        Timestamp
                    </span>
<span class="font-body-md text-body-md text-primary font-medium">8:51:24 AM</span>
</div>
<hr class="border-outline-variant/20 w-full"/>
<div class="flex justify-between items-center w-full">
<span class="font-body-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">location_on</span>
                        Distance
                    </span>
<span class="font-body-md text-body-md text-primary font-medium">28m</span>
</div>
<hr class="border-outline-variant/20 w-full"/>
<div class="flex justify-between items-center w-full">
<span class="font-body-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
                        Device
                    </span>
<span class="font-body-md text-body-md text-on-tertiary-container font-medium">Verified</span>
</div>
</div>
<!-- Snippet -->
<p class="z-10 font-label-md text-label-md text-on-surface-variant text-center mb-stack-lg w-full">
                Total points: 220 • Current Rank: #5
            </p>
<!-- CTA -->
<button class="z-10 w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full flex items-center justify-center gap-2 shadow-[0px_2px_8px_rgba(0,0,0,0.05)] hover:opacity-90 transition-opacity active:scale-[0.98]">
                Return to Dashboard
            </button>
</main>
</div>
<!-- Suppressed TopAppBar and BottomNavBar as this is a transactional success modal -->
</body></html>
