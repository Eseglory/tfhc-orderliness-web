<!doctype html>
<html lang="en"><head><link rel="icon" href="/icons/icon-192.png" type="image/png"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f9ff"><title>Offline workspace — TFHC Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f9ff;color:#0b1c30;font:16px/1.5 system-ui,sans-serif;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}main{max-width:760px;margin:auto}h1{font-size:1.75rem}h2{font-size:1.15rem}a{color:#304697}button,input,textarea{font:inherit;border:1px solid #747b88;border-radius:8px;padding:12px;min-height:44px}button{cursor:pointer;background:#131b2e;color:white}button:disabled{opacity:.5}input,textarea{width:100%;background:white;color:#0b1c30}textarea{min-height:140px}label{display:block}section,article{padding:20px;border-radius:16px;background:white;margin:16px 0;border:1px solid #d7deec}.row{display:flex;gap:12px;flex-wrap:wrap}.muted{color:#45464d}img{width:64px;height:64px}#status{min-height:24px}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6552bc;outline-offset:3px}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main>
<img src="/icons/icon-192.png" alt="TFHC Tracker"><h1>You're offline</h1>
<p>Use your saved schedule and drafts below. Check-ins, payments and approvals need internet access.</p>
<div class="row"><button id="retry">Try again</button><a href="/member/offline">Device settings</a><a href="/member/files">File inbox</a></div>
<section aria-label="Unlock saved content"><h2>Offline workspace</h2><p class="muted">Unlock saved content with the offline passphrase you set in Device settings.</p>
<form id="unlock-form"><label for="passphrase">Offline passphrase</label><input id="passphrase" type="password" minlength="12" required autocomplete="off"><button type="submit">Unlock saved content</button></form>
<button id="lock" hidden>Lock saved content</button><p id="status" role="status" aria-live="polite"></p></section>
<div id="records"></div>
</main><script src="/pwa-runtime.js"></script><script src="/offline-workspace.js"></script></body></html>
