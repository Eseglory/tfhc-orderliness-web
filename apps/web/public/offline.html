<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're offline — TFHC Tracker</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f8f9ff; color: #0b1c30; font-family: -apple-system, BlinkMacSystemFont, 'Inter', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; padding: 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); text-align: center; box-sizing: border-box; }
  .icon { width: 88px; height: 88px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 14px; color: #45464d; margin: 0 0 24px; max-width: 32ch; line-height: 1.5; }
  button { appearance: none; border: none; background: #131b2e; color: #ffffff; font-size: 15px; font-weight: 600; padding: 12px 28px; border-radius: 9999px; }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <img class="icon" src="/icons/icon-192.png" alt="" width="88" height="88" />
  <h1>You're offline</h1>
  <p>This page needs a connection the first time you open it. Check-ins, meetings and reports will sync again once you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
