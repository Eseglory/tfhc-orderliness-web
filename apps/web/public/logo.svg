<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%" height="100%">
  <defs>
    <!-- Vibrant Flame Gradient -->
    <linearGradient id="tfhc-flame-grad" x1="0%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="85%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Inner Flame Glow -->
    <linearGradient id="tfhc-flame-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Sleek Shadow -->
    <filter id="flame-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO MARK / SYMBOL -->
  <g transform="translate(10, 5)">
    <!-- Flame / Holy Spirit Fire -->
    <g filter="url(#flame-glow)">
      <!-- Outer Flame Tongue -->
      <path d="M 125,75 C 115,55 120,35 142,12 C 145,28 152,38 162,48 C 175,62 182,78 170,105 C 160,88 155,75 140,82 C 132,86 128,95 125,75 Z" 
            fill="url(#tfhc-flame-grad)" />
      <!-- Secondary Inner Flame Tongue -->
      <path d="M 138,70 C 132,54 136,40 148,22 C 150,34 156,42 162,50 C 168,60 170,72 160,90 C 154,78 148,72 142,75 Z" 
            fill="url(#tfhc-flame-inner)" opacity="0.9" />
    </g>

    <!-- House Silhouette Structure + Cross -->
    <!-- Roof Left Peak to Eaves -->
    <path d="M 40,118 L 138,58 L 202,96" 
          stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Left Main Pillar / Wall -->
    <path d="M 85,92 L 85,142" 
          stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Right Pillar extending into Christian Cross -->
    <!-- Vertical Cross Post -->
    <path d="M 202,70 L 202,142" 
          stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Crossbar -->
    <path d="M 182,88 L 226,88" 
          stroke="currentColor" stroke-width="11" stroke-linecap="round" fill="none" />

    <!-- Foundation Curved Swooshes / Ground Lines -->
    <!-- Top Curve -->
    <path d="M 30,146 C 80,138 150,140 215,145" 
          stroke="currentColor" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Bottom Swash -->
    <path d="M 45,158 C 95,148 145,150 190,156" 
          stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>

  <!-- TYPOGRAPHY / LOGO TEXT -->
  <!-- "THE" (Vibrant Accent Color) -->
  <text x="240" y="112" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="2" 
        fill="#F97316">THE</text>

  <!-- "FATHER'S" (Bold Custom Text with Λ Chevron for A) -->
  <g fill="currentColor" transform="translate(340, 112)">
    <!-- F -->
    <path d="M 0,-33 L 20,-33 L 20,-26 L 7,-26 L 7,-19 L 18,-19 L 18,-12 L 7,-12 L 7,0 L 0,0 Z" />
    <!-- A (Stylized Chevron Λ without crossbar) -->
    <path d="M 35,-33 L 45,-33 L 57,0 L 49,0 L 40,-24 L 31,0 L 23,0 Z" />
    <!-- T -->
    <path d="M 59,-33 L 83,-33 L 83,-26 L 75,-26 L 75,0 L 67,0 L 67,-26 L 59,-26 Z" />
    <!-- H -->
    <path d="M 87,-33 L 94,-33 L 94,-20 L 110,-20 L 110,-33 L 117,-33 L 117,0 L 110,0 L 110,-13 L 94,-13 L 94,0 L 87,0 Z" />
    <!-- E -->
    <path d="M 123,-33 L 143,-33 L 143,-26 L 130,-26 L 130,-19 L 141,-19 L 141,-12 L 130,-12 L 130,-7 L 144,-7 L 144,0 L 123,0 Z" />
    <!-- R -->
    <path d="M 149,-33 L 166,-33 C 173,-33 177,-29 177,-23 C 177,-18 173,-14 166,-14 L 156,-14 L 178,0 L 169,0 L 149,-14 L 156,-14 L 156,-26 L 165,-26 C 168,-26 170,-25 170,-23 C 170,-21 168,-20 165,-20 L 156,-20 L 156,-33 Z" />
    <!-- ' (Apostrophe) -->
    <path d="M 180,-35 L 185,-35 L 183,-25 L 179,-25 Z" fill="#F97316" />
    <!-- S -->
    <path d="M 197,-7 C 193,-7 190,-9 190,-12 C 190,-16 195,-17 200,-19 C 206,-21 210,-23 210,-28 C 210,-32 205,-34 198,-34 C 191,-34 187,-31 186,-26 L 193,-26 C 194,-28 196,-28 198,-28 C 201,-28 203,-27 203,-25 C 203,-24 200,-23 195,-21 C 189,-19 183,-17 183,-11 C 183,-5 189,-1 198,-1 C 206,-1 211,-4 212,-9 L 205,-9 C 204,-7 201,-7 197,-7 Z" />
  </g>

  <!-- "HOUSE" (Wide Spaced Subtext) -->
  <text x="342" y="142" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="700" 
        font-size="18" 
        letter-spacing="18" 
        fill="#F97316" 
        opacity="0.95">HOUSE</text>
</svg>
