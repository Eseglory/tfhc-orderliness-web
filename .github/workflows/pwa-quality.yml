name: PWA quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && yarn install --immutable
      - run: yarn build:shared && yarn workspace @tfhc/api prisma:generate
      - run: yarn workspace @tfhc/api test --runTestsByPath test/pwa.spec.ts test/pwa-advanced.spec.ts
      - run: yarn exec playwright install --with-deps chromium webkit
      - run: yarn build:web
        env:
          NEXT_DIST_DIR: .next-pwa
          NEXT_TELEMETRY_DISABLED: '1'
      - run: yarn exec playwright test --config playwright.pwa.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pwa-browser-traces
          path: test-results-pwa
