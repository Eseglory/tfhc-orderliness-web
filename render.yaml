services:
  # NestJS API — Prisma/PostgreSQL backend consumed by the web PWA.
  - type: web
    name: tfhc-orderliness-api
    branch: main
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'
      # Set the Supabase pooled connection URL in the Render dashboard.
      # Keep the password in Render's secret environment settings.
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: mail.eglobalicthub.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_SECURE
        value: 'true'
      - key: SMTP_USER
        value: tfhc-orderliness@eglobalicthub.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: 'TFHC Orderliness <tfhc-orderliness@eglobalicthub.com>'
      - key: JWT_SECRET
        generateValue: true
      - key: TFHC_TIMEZONE
        value: Africa/Lagos
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:tfhc-orderliness@eglobalicthub.com
      # Update after first deploy if Render assigns a different subdomain
      # than the `name:` above (e.g. on a name collision).
      - key: CORS_ORIGIN
        value: https://tfhc-orderliness-web.onrender.com

  # Next.js mobile-first PWA — installable frontend for members and admins.
  - type: web
    name: tfhc-orderliness-web
    branch: main
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: NEXT_PUBLIC_API_URL
        value: https://tfhc-orderliness-api.onrender.com
      - key: PWA_API_URL
        value: https://tfhc-orderliness-api.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
