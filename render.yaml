services:
  # Compatibility address only. The production writer runs on the VPS.
  # Never restore DATABASE_URL here while SQLite has pending operations.
  - type: web
    name: tfhc-orderliness-api
    branch: main
    runtime: docker
    dockerfilePath: ./deploy/vps/Dockerfile.proxy
    dockerContext: .
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'

  # Next.js mobile-first PWA — installable frontend for members and admins.
  - type: web
    name: tfhc-orderliness-web
    branch: main
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: NEXT_PUBLIC_API_URL
        value: https://tfhc.eglobalicthub.com
      - key: PWA_API_URL
        value: https://tfhc.eglobalicthub.com
      - key: NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
