version: '3.8'

services:
  # 1. High-Performance PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: tfhc_postgres_db
    restart: always
    environment:
      POSTGRES_DB: tfhc_orderliness_db
      POSTGRES_USER: tfhc_user
      POSTGRES_PASSWORD: tfhc_secure_password_2026
    ports:
      - "54399:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfhc_user -d tfhc_orderliness_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tfhc_network

  # 2. Secure NestJS Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tfhc_backend_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://tfhc_user:tfhc_secure_password_2026@db:5432/tfhc_orderliness_db?schema=public&connection_limit=20
      JWT_SECRET: tfhc-prod-secret-jwt-key-2026
      # Set to enable member Google sign-in locally; must include the same
      # value as GOOGLE_OAUTH_WEB_CLIENT_ID below (the web service's build
      # arg only takes one client ID, this API accepts a comma-separated list).
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_WEB_CLIENT_ID:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tfhc_network

  # 3. Secure Next.js Web Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* vars are inlined into the client bundle at build time —
      # setting them under `environment:` below has no effect on the built
      # app; they must be passed as build args.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_OAUTH_WEB_CLIENT_ID:-}
    container_name: tfhc_frontend_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - tfhc_network

volumes:
  postgres_data:
    driver: local

networks:
  tfhc_network:
    driver: bridge
